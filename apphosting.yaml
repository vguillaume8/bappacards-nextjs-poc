runConfig:
  runtime: nodejs22
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  maxInstances: 1   # free-tier: keep at 1 to avoid charges
  minInstances: 0   # scale to zero when idle

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://bappacards-nextjs-poc--main.us-central1.hosted.app
    availability:
      - BUILD
      - RUNTIME

  - variable: API_BASE_URL
    value: https://api.bappacards.com/api/v1
    availability:
      - RUNTIME

  # Firebase client config — NOT secrets; publicly embedded in JS bundle at build time
  - variable: NEXT_PUBLIC_FIREBASE_KEY
    value: AIzaSyAovi93QVitIIEsV4xteIWh63heirMRHz4
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_DOMAIN
    value: bappacards-1636a.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: bappacards-1636a
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: bappacards-1636a.appspot.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_SENDER_ID
    value: "525337956553"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:525337956553:web:12b090822872e7b10b3d18
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-4XKRRZYT1Q
    availability:
      - BUILD
      - RUNTIME

  # API URL for client-side fetch (NEXT_PUBLIC_API_BASE_URL is what src/lib/api.ts reads)
  - variable: NEXT_PUBLIC_API_BASE_URL
    value: https://api.bappacards.com/api/v1
    availability:
      - BUILD
      - RUNTIME

  # Analytics — GA measurement ID matches Firebase Analytics property for this app
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: G-4XKRRZYT1Q
    availability:
      - BUILD
      - RUNTIME
