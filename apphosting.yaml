runConfig:
  runtime: nodejs22
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  maxInstances: 1   # free-tier: keep at 1 to avoid charges
  minInstances: 0   # scale to zero when idle

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://bappacards-nextjs-poc--main.us-central1.hosted.app
    availability:
      - BUILD
      - RUNTIME

  - variable: API_BASE_URL
    value: https://api.bappacards.com/api/v1
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_KEY
    secret: NEXT_PUBLIC_FIREBASE_KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_DOMAIN
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_SENDER_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    secret: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SENTRY_DSN
    secret: NEXT_PUBLIC_SENTRY_DSN
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    secret: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_META_PIXEL_ID
    secret: NEXT_PUBLIC_META_PIXEL_ID
    availability: [BUILD, RUNTIME]
